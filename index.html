<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strickliesl">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Strickliesl</title>
<style>
:root{--bg:#f3efe9;--card:#fffdf9;--ink:#2b2622;--mute:#6f665d;--line:#ddd5ca;--knit:#7a3f5c;--crochet:#2f6f62;--acc:var(--crochet);--ok:#2f6f62;--warn:#a5622a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,system-ui,sans-serif;overscroll-behavior:none}
h1,h2,h3{font-family:Georgia,'Iowan Old Style',serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;min-height:64px}
.top h1{flex:1;font-size:24px}.top .ib{min-width:48px;min-height:48px;border-radius:24px;font-size:22px}
.scroll{flex:1;overflow:auto;padding:8px 20px 110px;max-width:900px;width:100%;margin:0 auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.tile{border-radius:24px;padding:28px 20px;min-height:200px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.tile .em{font-size:54px;line-height:1}.tile h2{font-size:28px}.tile span{opacity:.9;font-size:15px}
.k{background:var(--knit)}.c{background:var(--crochet)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0;width:100%;text-align:left;display:block}
.card small,.mute{color:var(--mute)}.card b{display:block;font-size:19px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.fab{position:fixed;right:calc(24px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:36px;background:var(--acc);color:#fff;font-size:38px;box-shadow:0 6px 18px #0003}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.dlg{background:var(--card);border-radius:22px;padding:22px;max-width:460px;width:100%;max-height:85%;overflow:auto}
.dlg h3{font-size:22px;margin-bottom:8px}.dlg p{margin:0 0 14px;white-space:pre-line}
.dlg button{display:block;width:100%;min-height:52px;border-radius:14px;margin-top:8px;background:var(--bg);font-weight:600}
.dlg button.p{background:var(--acc);color:#fff}
.cnt{flex:1;display:flex;flex-direction:column;min-height:0}
.main{flex:1;overflow:hidden;padding:4px 20px;display:grid;gap:14px;align-content:start;max-width:1000px;width:100%;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 8px;max-width:1000px;width:100%;margin:0 auto}
.chip{padding:10px 16px;border-radius:22px;background:var(--card);border:1px solid var(--line);white-space:nowrap;min-height:44px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sec{color:var(--mute)}.big{font-family:Georgia,serif;font-size:clamp(26px,4.2vw,42px);line-height:1.25}
.badge{display:inline-block;background:var(--warn);color:#fff;border-radius:14px;padding:2px 12px;font-weight:600;font-size:16px;margin-left:8px;vertical-align:middle}
.boxes{display:flex;flex-wrap:wrap;gap:8px}
.bx{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;background:var(--card)}
.bx.d{background:#e3eee9;border-color:#e3eee9;color:var(--ok)}.bx.n{background:var(--acc);border-color:var(--acc);color:#fff}
.bx.m{border-style:dashed;border-color:var(--warn)}
.hint{color:var(--warn);font-weight:600}
.dock{padding:12px 20px 18px;display:flex;align-items:center;gap:16px;max-width:1000px;width:100%;margin:0 auto}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,auto);gap:8px;justify-content:start;column-gap:22px}
.stats b{display:block;font-size:22px;font-family:Georgia,serif}.stats small{color:var(--mute)}
.plus{width:150px;height:150px;border-radius:75px;background:var(--acc);color:#fff;font-size:72px;font-weight:300;box-shadow:0 8px 22px #0003;flex:none}
.sm{min-height:52px;padding:0 18px;border-radius:26px;background:var(--card);border:1px solid var(--line);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:200px;background:#2b2622;color:#fff;border-radius:22px;padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;z-index:5}
.toast button{color:#ffd9a8;font-weight:700;min-height:40px;padding:0 10px}
@media(orientation:landscape) and (min-width:800px){.main{grid-template-columns:1fr 1fr;align-content:start}.dock{padding-bottom:12px}}
@media(max-width:560px){.tiles{grid-template-columns:1fr}.tile{min-height:130px}.plus{width:120px;height:120px}}
</style></head><body><div id="app"></div>
<script>
'use strict';
const V='0.1.0',KEY='strickliesl-v1',GUARD=450;
let db=load(),view={n:'home'},lastTap=0,toastT;
function load(){const d={library:[],projects:[],last:null};try{return Object.assign(d,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return d}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){dlg('Speichern nicht möglich','Der Speicher des Geräts ist gesperrt oder voll.')}}
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=(v,s)=>Array.isArray(v)?v[s]:v;
const U=p=>p.unit||'Reihe';

// ---- Anleitung zu Reihenliste ausrollen ----
function unroll(p,pi,s){const part=p.parts[pi];let cur=val(part.castOn,s)||0;const rows=[];
 part.sections.forEach((sec,si)=>{const reps=val(sec.repeats,s)||1;
  for(let r=0;r<reps;r++)sec.rows.forEach((row,ri)=>{
   const step=!!row.step,d=step?0:(val(row.delta,s)||0),set=step?null:val(row.set,s);
   if(set!=null)cur=set;else cur+=d;
   rows.push({si,sec:sec.name,rep:r+1,reps,ri,blk:sec.rows.length,text:row.text,side:row.side||'',delta:d,step,cur,hide:!step&&sec.count===false&&set==null});
  })});
 return rows}
function validate(p){const e=[];
 if(!p||typeof p!=='object'||p.kind!=='pattern')return['Das ist keine Anleitung (kind: "pattern" fehlt).'];
 if(!p.id)e.push('Die Anleitung braucht eine id.');
 if(!p.name)e.push('Der Name fehlt.');
 if(!['stricken','haekeln'].includes(p.craft))e.push('craft muss "stricken" oder "haekeln" sein.');
 if(!Array.isArray(p.parts)||!p.parts.length)return e.concat('Die Anleitung hat keinen Teil.');
 const n=(p.sizes&&p.sizes.length)||1;let ok=true;
 p.parts.forEach((pt,i)=>{if(!Array.isArray(pt.sections)||!pt.sections.length){e.push(`Teil ${i+1} hat keine Abschnitte.`);ok=false;return}
  pt.sections.forEach((s,j)=>{if(!Array.isArray(s.rows)||!s.rows.length){e.push(`Abschnitt ${j+1} in „${pt.name||'Teil '+(i+1)}" hat keine Reihen.`);ok=false}})});
 if(ok)p.parts.forEach((pt,i)=>{for(let s=0;s<n;s++){const r=unroll(p,i,s).find(x=>x.cur<0);if(r)e.push(`In „${pt.name}" fällt die Maschenzahl unter 0 (${r.sec}${n>1?', Größe '+p.sizes[s]:''}).`)}});
 return e}

// ---- Dialoge ----
function dlg(title,text,btns){return new Promise(res=>{const o=document.createElement('div');o.className='ov';
 btns=btns||[{t:'OK',v:true,p:1}];
 o.innerHTML=`<div class="dlg" role="dialog"><h3>${esc(title)}</h3><p>${esc(text||'')}</p>`+btns.map((b,i)=>`<button data-i="${i}" class="${b.p?'p':''}">${esc(b.t)}</button>`).join('')+'</div>';
 o.onclick=e=>{const b=e.target.closest('button');if(!b)return;o.remove();res(btns[b.dataset.i].v)};document.body.appendChild(o)})}
function toast(t,undo){clearTimeout(toastT);document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';
 d.innerHTML=`<span>${esc(t)}</span><button>Rückgängig</button>`;d.querySelector('button').onclick=()=>{d.remove();undo()};document.body.appendChild(d);toastT=setTimeout(()=>d.remove(),4000)}

// ---- Projekte ----
const cur=()=>db.projects.find(p=>p.id===view.id);
function pct(p){let a=0,b=0;p.pattern.parts.forEach((_,i)=>{b+=unroll(p.pattern,i,p.size).length;a+=p.done[i]||0});return b?Math.round(a/b*100):0}
async function importFile(f){try{const p=JSON.parse(await f.text());const e=validate(p);
 if(e.length)return dlg('Das hat nicht geklappt',e.join('\n'));
 const i=db.library.findIndex(x=>x.id===p.id);if(i>=0)db.library[i]=p;else db.library.push(p);save();
 await dlg(i>=0?'Anleitung ersetzt':'Anleitung eingespielt',`„${p.name}" liegt jetzt in deiner Bibliothek (${p.craft==='haekeln'?'Häkeln':'Stricken'}).`);render()
 }catch(e){dlg('Das hat nicht geklappt','Die Datei ist keine gültige JSON-Datei.')}}
function pickFile(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>i.files[0]&&importFile(i.files[0]);i.click()}
async function plus(){const c=view.craft;const a=await dlg('Was möchtest du tun?','',[{t:'Projekt aus Anleitung starten',v:'new',p:1},{t:'Anleitung einspielen',v:'imp'},{t:'Abbrechen',v:0}]);
 if(a==='imp')pickFile();
 if(a==='new'){const lib=db.library.filter(p=>p.craft===c);
  if(!lib.length)return dlg('Noch keine Anleitung','Spiel zuerst eine Anleitung ein (Plus-Knopf, „Anleitung einspielen").');
  const pi=await dlg('Welche Anleitung?','',lib.map((p,i)=>({t:p.name,v:i})).concat([{t:'Abbrechen',v:-1}]));if(pi<0)return;
  const pat=lib[pi];let s=0;
  if(pat.sizes&&pat.sizes.length>1){s=await dlg('Welche Größe?','Du wählst sie einmal, danach zeigt die App nur noch diese Zahlen.',pat.sizes.map((x,i)=>({t:x,v:i})).concat([{t:'Abbrechen',v:-1}]));if(s<0)return}
  const pr={id:'p'+Date.now(),craft:c,name:pat.name,size:s,pattern:JSON.parse(JSON.stringify(pat)),done:pat.parts.map(()=>0),part:0,t:Date.now()};
  db.projects.push(pr);db.last=pr.id;save();view={n:'count',id:pr.id};render()}}
function step(dir){const p=cur(),n=p.done[p.part],len=unroll(p.pattern,p.part,p.size).length;
 if(dir>0){if(n>=len)return;const now=Date.now();if(now-lastTap<GUARD)return;lastTap=now}
 if(dir<0&&n<=0)return;
 p.done[p.part]=n+dir;p.t=Date.now();db.last=p.id;save();render();
 toast(dir>0?'Weitergezählt':'Eine zurück',()=>{p.done[p.part]=n;save();render()})}

// ---- Ansichten ----
function render(){const v=view;app.innerHTML='';
 document.documentElement.style.setProperty('--acc',v.craft==='stricken'||(cur()&&cur().craft==='stricken')?'var(--knit)':'var(--crochet)');
 if(v.n==='home')home();else if(v.n==='list')list();else count()}
function go(x){view=x;render()}
function home(){const l=db.projects.find(p=>p.id===db.last);
 app.innerHTML=`<div class="top"><h1>Strickliesl</h1></div><div class="scroll">
 ${l?`<button class="card" data-go="${l.id}"><small>Weiter mit …</small><b>${esc(l.name)}</b><small>${l.craft==='haekeln'?'Häkeln':'Stricken'} · ${pct(l)} %</small><div class="bar"><i style="width:${pct(l)}%"></i></div></button>`:''}
 <div class="tiles"><button class="tile k" data-c="stricken"><span class="em">🧶</span><h2>Stricken</h2><span>${db.projects.filter(p=>p.craft==='stricken').length} Projekte</span></button>
 <button class="tile c" data-c="haekeln"><span class="em">🪝</span><h2>Häkeln</h2><span>${db.projects.filter(p=>p.craft==='haekeln').length} Projekte</span></button></div>
 <p class="mute" style="margin-top:24px">Tipp: Teile in Safari → „Zum Home-Bildschirm", dann spielst du deine Anleitungen in der App ein. Deine Daten bleiben auf diesem Gerät. Version ${V}.</p></div>`;
 app.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c)go({n:'list',craft:b.dataset.c});if(b.dataset.go)go({n:'count',id:b.dataset.go})}}
function list(){const c=view.craft,ps=db.projects.filter(p=>p.craft===c).sort((a,b)=>(pct(a)>=100)-(pct(b)>=100)||b.t-a.t);
 app.innerHTML=`<div class="top"><button class="ib" data-b>‹</button><h1>${c==='haekeln'?'Häkeln':'Stricken'}</h1></div><div class="scroll">
 ${ps.map(p=>`<button class="card" data-go="${p.id}"><b>${esc(p.name)}</b><small>${pct(p)>=100?'Fertig':'läuft · '+pct(p)+' %'}</small><div class="bar"><i style="width:${pct(p)}%"></i></div></button>`).join('')||'<p class="mute">Noch kein Projekt. Tippe auf das Plus, um eine Anleitung einzuspielen oder ein Projekt zu starten.</p>'}</div>
 <button class="fab" data-plus aria-label="Neu">+</button>`;
 app.onclick=e=>{const b=e.target.closest('button');if(!b)return;if('b' in b.dataset)go({n:'home'});else if('plus' in b.dataset)plus();else if(b.dataset.go)go({n:'count',id:b.dataset.go})}}
function count(){const p=cur();if(!p)return go({n:'home'});const pat=p.pattern,u=U(pat);
 const rows=unroll(pat,p.part,p.size),d=p.done[p.part],real=rows.filter(r=>!r.step),r=rows[d];
 const partDone=i=>p.done[i]>=unroll(pat,i,p.size).length;
 const chips=pat.parts.length>1?`<div class="chips">${pat.parts.map((x,i)=>`<button class="chip ${i===p.part?'on':''}" data-part="${i}">${partDone(i)?'✓ ':''}${esc(x.name)}</button>`).join('')}</div>`:'';
 let body,stats='';
 if(!r){const nx=pat.parts.findIndex((_,i)=>!partDone(i));
  body=`<div class="card"><h2>${esc(pat.parts[p.part].name)} ist fertig 🎉</h2><p>${nx>=0?'Weiter geht es mit dem nächsten Teil.':'Das ganze Projekt ist fertig. Wunderbar!'}</p>${nx>=0?`<button class="sm" data-part="${nx}">Weiter mit ${esc(pat.parts[nx].name)}</button>`:''}</div>`}
 else{const k=rows.slice(0,d+1).filter(x=>!x.step).length;
  const blk=rows.map((x,i)=>[x,i]).filter(([x])=>x.si===r.si&&x.rep===r.rep);
  let hint='';if(!r.step){const nx=rows.slice(d+1).filter(x=>!x.step).findIndex(x=>x.delta!==0);
   if(nx===0)hint=`Nächste ${u}: ${rows.slice(d+1).find(x=>!x.step).delta>0?'Zunahme':'Abnahme'}`;else if(nx>0&&nx<3){const t=rows.slice(d+1).filter(x=>!x.step)[nx];hint=`${t.delta>0?'Zunahme':'Abnahme'} in ${nx+1} ${u==='Reihe'?'Reihen':'Runden'}`}}
  body=`<div><div class="sec">${esc(r.sec||'')}</div><div class="sec">${r.step?'Arbeitsschritt':`${u} ${k} von ${real.length}`}${r.side?' · '+esc(r.side):''}${r.delta?`<span class="badge">${r.delta>0?'+':''}${r.delta} M</span>`:''}</div><div class="big">${esc(r.text)}</div></div>
  <div><div class="boxes">${blk.map(([x,i])=>`<div class="bx ${i<d?'d':i===d?'n':''} ${x.delta&&i>d?'m':''}">${i<d?'✓':x.step?'•':x.ri+1}</div>`).join('')}</div><div class="hint" style="margin-top:10px">${esc(hint)}</div></div>`;
  stats=`<div><b>${r.reps>1?r.rep+'/'+r.reps:'–'}</b><small>Wiederholung</small></div><div><b>${r.hide?'–':(d>0?rows[d-1].cur:r.cur-r.delta)}</b><small>Maschen</small></div><div><b>${Math.round(d/rows.length*100)} %</b><small>Teil</small></div>`}
 app.innerHTML=`<div class="top"><button class="ib" data-b aria-label="Zurück zur Liste">‹</button><h1>${esc(p.name)}</h1><button class="ib" data-menu aria-label="Mehr">⋯</button></div>${chips}
 <div class="cnt"><div class="main">${body}</div><div class="dock"><div class="stats">${stats}</div><button class="sm" data-back>Zurück</button>${r?'<button class="plus" data-plus aria-label="Weiter">+</button>':''}</div></div>`;
 app.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if('b' in b.dataset)go({n:'list',craft:p.craft});else if('plus' in b.dataset)step(1);else if('back' in b.dataset)step(-1);
  else if(b.dataset.part!=null){p.part=+b.dataset.part;save();render()}
  else if('menu' in b.dataset){if(await dlg('Projekt',p.name,[{t:'Projekt löschen',v:'del'},{t:'Abbrechen',v:0,p:1}])==='del'&&await dlg('Wirklich löschen?','Der Fortschritt dieses Projekts geht verloren. Die Anleitung bleibt in der Bibliothek.',[{t:'Löschen',v:1},{t:'Abbrechen',v:0,p:1}])){db.projects=db.projects.filter(x=>x!==p);if(db.last===p.id)db.last=null;save();go({n:'list',craft:p.craft})}}}}
render();
</script></body></html>
